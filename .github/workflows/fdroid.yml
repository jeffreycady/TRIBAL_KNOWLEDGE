name: Publish F-Droid repo

# Runs when you push a version tag (for example v1.0.0) or start it by hand.
# Expects an UNSIGNED APK committed at android/app-unsigned.apk.
# Signs it, builds the F-Droid index, and uploads the repo to Cloudflare R2.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: fdroid-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PKG: org.jcady.tk.twa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Locate apksigner
        id: tools
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner=$SIGNER" >> "$GITHUB_OUTPUT"

      - name: Restore keystores from secrets
        env:
          APP_KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          REPO_KS_B64: ${{ secrets.REPO_KEYSTORE_B64 }}
        run: |
          echo "$APP_KS_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
          echo "$REPO_KS_B64" | base64 -d > "$RUNNER_TEMP/repo.jks"

      - name: Sign the APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p fdroid/repo
          VERSION="${GITHUB_REF_NAME#v}"
          "${{ steps.tools.outputs.apksigner }}" sign \
            --ks "$RUNNER_TEMP/app.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "fdroid/repo/${PKG}_${VERSION:-manual}.apk" \
            android/app-unsigned.apk
          "${{ steps.tools.outputs.apksigner }}" verify --print-certs "fdroid/repo/${PKG}_${VERSION:-manual}.apk"

      - name: Write F-Droid config
        env:
          REPO_KS_PASS: ${{ secrets.REPO_KEYSTORE_PASSWORD }}
          REPO_KEY_ALIAS: ${{ secrets.REPO_KEY_ALIAS }}
        run: |
          cat > fdroid/config.yml <<EOF
          repo_url: https://fdroid.jcady.org/repo
          repo_name: Tribal Knowledge
          repo_description: Updates for the Tribal Knowledge app.
          repo_keyalias: ${REPO_KEY_ALIAS}
          keystore: ${RUNNER_TEMP}/repo.jks
          keystorepass: ${REPO_KS_PASS}
          keypass: ${REPO_KS_PASS}
          keydname: "CN=Jeff Cady, O=JCady LLC, C=US"
          EOF
          chmod 0600 fdroid/config.yml

      - name: Build the F-Droid index
        working-directory: fdroid
        run: fdroid update

      - name: Upload repo to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Index files change every release, so tell browsers and the F-Droid client not to cache them.
          aws s3 sync fdroid/repo "s3://${R2_BUCKET}/repo" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*.apk" --include "*.jar" --include "*.xml" --include "*.json" --include "*.png" \
            --cache-control "public, max-age=300"

      - name: Clean up keys
        if: always()
        run: rm -f "$RUNNER_TEMP/app.jks" "$RUNNER_TEMP/repo.jks" fdroid/config.yml
